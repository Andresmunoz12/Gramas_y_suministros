services:
  # --- BACKEND (NestJS) ---
  api_gramas:
    build:
      context: ./Backend/backend-nest-typeorm
      dockerfile: Dockerfile
    container_name: nestjs_container
    command: npm run start:dev
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./Backend/backend-nest-typeorm:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-SUPER_SECRET_KEY_123}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
