services:
  # --- BASE DE DATOS ---
  db_gramas:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_DATABASE: gramas_db
      MYSQL_ROOT_PASSWORD: admin_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- BACKEND (NestJS) ---
  api_gramas:
    build:
      context: ./Backend/backend-nest-typeorm
      dockerfile: Dockerfile
    container_name: nestjs_container
    command: npm run start:dev
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./Backend/backend-nest-typeorm:/app
      - /app/node_modules
    depends_on:
      db_gramas:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"net\").createConnection({port:3000,host:\"127.0.0.1\"}).on(\"error\",()=>process.exit(1)).on(\"connect\",()=>process.exit(0))'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      DATABASE_HOST: db_gramas
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: admin_password
      DATABASE_NAME: gramas_db
      JWT_SECRET: SUPER_SECRET_KEY_123

  # --- FRONTEND (React/Vite) ---
  frontend_gramas:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: react_frontend_container
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      api_gramas:
        condition: service_healthy

volumes:
  mysql_data: